<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ДЗ 2. Конструктор посещения события</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <section class="event-card">
        <h1 id="event-title">Ночь в музее</h1>

        <p>15 ноября, 18:30</p>
        <p>Музей космонавтики, проспект Мира, 111</p>
        <p>Вечерняя программа с выставкой и экскурсиями</p>

        <button id="show-program" type="button">Показать программу</button>

        <div id="program" hidden></div>
      </section>

      <p id="data-error" class="error" hidden></p>

      <form id="service-form" class="service-form" hidden>
        <h2>Выберите услуги</h2>

        <p>
          <label>
            <input type="checkbox" id="guide" name="guide" />
            Экскурсия с гидом — 500 руб.
          </label>
        </p>

        <p>
          <label>
            <input type="checkbox" id="audio" name="audio" />
            Аудиогид — 350 руб.
          </label>
        </p>

        <p>
          <label>
            <input type="checkbox" id="catalog" name="catalog" />
            Каталог выставки — 250 руб.
          </label>
        </p>

        <button type="submit">Рассчитать стоимость</button>
      </form>

      <p id="choice-error" class="error" hidden></p>
      <p id="result" hidden></p>
      <p id="report-json" hidden></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
